{"name":"bootstrap","on":{"push":{"branches":["main"]},"workflow_dispatch":null},"jobs":{"build":{"runs-on":"ubuntu-24.04","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.10.2"}},{"name":"Prepare release signing key (if secret set)","env":{"KS":"${{ secrets.ZAEEM_KEYSTORE_B64 }}"},"run":"if [ -n \"$KS\" ]; then echo \"$KS\" | base64 -d > $RUNNER_TEMP/zaeem.jks; echo \"ZAEEM_KEYSTORE=$RUNNER_TEMP/zaeem.jks\" >> $GITHUB_ENV; echo \"ZAEEM_KS_PASS=${{ secrets.ZAEEM_KS_PASS }}\" >> $GITHUB_ENV; echo \"ZAEEM_KEY_ALIAS=${{ secrets.ZAEEM_KEY_ALIAS }}\" >> $GITHUB_ENV; fi"},{"run":"gradle :core:runCoreTests :app:assembleRelease --no-daemon --stacktrace"},{"uses":"actions/upload-artifact@v4","with":{"name":"zaeem-browser-apk","path":"app/build/outputs/apk/release/*.apk"}}]}}}
